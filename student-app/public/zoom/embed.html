<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Class video</title>
    <!--
      Runs Zoom's Meeting SDK (component view) on its own page, inside an iframe of the app.
      The SDK brings its own React 18; keeping it here stops it clashing with the app's React.
      The app sends { type: 'join', payload } with details from the zoom server function.
      This page answers with { type: 'ready' | 'joined' | 'left' | 'error', message? }.
      { type: 'leave' } leaves the meeting (the class page sends it when the child leaves the page).
      Copied from EDUCINEVA's public/zoom/embed.html (Zoom Meeting SDK 6.5.0, component view).
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141833;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const VERSION = '6.5.0';
      const BASE = 'https://source.zoom.us/' + VERSION;
      const SCRIPTS = [
        BASE + '/lib/vendor/react.min.js',
        BASE + '/lib/vendor/react-dom.min.js',
        BASE + '/lib/vendor/redux.min.js',
        BASE + '/lib/vendor/redux-thunk.min.js',
        BASE + '/lib/vendor/react-redux.min.js',
        BASE + '/lib/vendor/lodash.min.js',
        'https://source.zoom.us/zoom-meeting-embedded-' + VERSION + '.min.js',
      ];

      function load(src) {
        return new Promise(function (resolve, reject) {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = function () {
            reject(new Error('Could not load the video player. Check your internet.'));
          };
          document.head.appendChild(s);
        });
      }

      const ready = SCRIPTS.reduce(function (p, src) {
        return p.then(function () {
          return load(src);
        });
      }, Promise.resolve());

      function send(msg) {
        window.parent.postMessage(msg, window.location.origin);
      }

      // Zoom's player keeps its own default sizes (nothing set here). The page tells the app how big the player
      // is, and whenever it changes (for example when the teacher shares a screen), and the app shapes its big
      // box to match. The player starts 88px down, out of reach; the rule below puts it at the top left.
      const placement = document.createElement('style');
      document.head.appendChild(placement);
      // The player is centred in the page. Only the player itself is pinned there: Zoom's own panels (chat,
      // people, settings) are also "react-draggable", and pinning them too put them off screen.
      function playerElement() {
        return Array.prototype.find.call(document.querySelectorAll('.react-draggable'), function (el) {
          return !el.closest('.zoom-MuiPopper-root') && !el.classList.contains('zoom-MuiBox-root') && el.querySelector('video, canvas');
        }) || document.querySelector('.react-draggable');
      }
      function place(w, h) {
        const left = Math.max(0, Math.round((window.innerWidth - w) / 2));
        const top = Math.max(0, Math.round((window.innerHeight - h) / 2));
        const player = playerElement();
        if (player && !player.hasAttribute('data-mirai-player')) {
          Array.prototype.forEach.call(document.querySelectorAll('[data-mirai-player]'), function (el) {
            el.removeAttribute('data-mirai-player');
          });
          player.setAttribute('data-mirai-player', '');
        }
        const css =
          '[data-mirai-player]{transform:translate(' + left + 'px,' + top + 'px)!important}' +
          '.react-draggable.zoom-MuiBox-root{transform:translate(0,0)!important}';
        if (placement.textContent !== css) placement.textContent = css;
      }
      let activeClient = null;
      let lastSize = '';
      // A screen is being shared when Zoom has drawn the shared-screen canvas.
      // Zoom keeps hidden (zero-size) "Stop Share" buttons in the page all the time, so only a visible one counts.
      function isSharing() {
        if (/You are viewing .* screen/i.test(document.body.innerText || '')) return true;
        return Array.prototype.some.call(document.querySelectorAll('[aria-label="Pause screen sharing"],[aria-label="Stop Share"]'), function (el) {
          const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0;
        });
      }
      // The room the app gives the player (its size on screen). Zoom is asked to draw the player as large as fits
      // in it, instead of drawing it small and the app enlarging it (blurry). The player's height follows its width
      // (header, video, toolbar), so the width is chosen from the shape the player has now.
      let room = null;
      let asked = '';
      // The faces beside a shared screen: folded unless the child shows them (the app's "Show class" button).
      let showPeople = false;
      function fitPlayer() {
        if (!activeClient || !room || switching) return;
        const el = playerElement();
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.width < 50 || r.height < 50) return;
        // While a screen is shared (strip view), Zoom's "ribbon" size is the column of faces beside the shared screen
        // (its width) and the height of both (Zoom's own bar and toolbar, about 84px, come on top). The shared screen
        // gets the rest of the player's width, so the faces are folded to almost nothing unless the child asks for them.
        if (view === 'ribbon') {
          const height = Math.max(200, room.height - 84);
          const key = 'ribbon:' + (showPeople ? 'people' : 'screen') + ':' + height;
          if (key === asked) return;
          asked = key;
          try {
            Promise.resolve(activeClient.updateVideoOptions({ viewSizes: { ribbon: { width: showPeople ? 180 : 1, height: height } } })).catch(function () {});
          } catch (err) {}
          return;
        }
        const ratio = r.height / r.width;
        const width = Math.max(240, Math.floor(Math.min(room.width, room.height / ratio)));
        const key = view + ':' + width;
        if (key === asked || Math.abs(width - r.width) < 12) return;
        asked = key;
        const size = { width: width, height: Math.round((width * 9) / 16) };
        try {
          Promise.resolve(activeClient.updateVideoOptions({ viewSizes: { default: size } })).catch(function () {});
        } catch (err) {}
      }
      // A shared screen starts at "Original Size" (cut off when it is bigger than the player): each new share is set
      // to "Fit to Window" once, from Zoom's own View Options menu.
      let fittedShare = false;
      function fitSharedScreen() {
        const sharing = isSharing();
        if (!sharing) {
          fittedShare = false;
          return;
        }
        if (fittedShare) return;
        const button = Array.prototype.find.call(document.querySelectorAll('button,[role=button]'), function (b) {
          return /^View Options/.test(((b.getAttribute('aria-label') || b.innerText || '') + '').trim());
        });
        if (!button) return;
        fittedShare = true;
        button.click();
        setTimeout(function () {
          const item = Array.prototype.find.call(document.querySelectorAll('[role^=menuitem]'), function (el) {
            return /Fit to Window/i.test(el.innerText || '');
          });
          if (item) item.click();
          else document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        }, 300);
      }
      function reportSize() {
        const el = playerElement();
        if (!el) return;
        const r = el.getBoundingClientRect();
        place(r.width, r.height);
        const sharing = isSharing();
        const key = Math.round(r.width) + 'x' + Math.round(r.height) + (sharing ? 's' : '');
        if (r.width < 50 || key === lastSize) return;
        lastSize = key;
        send({ type: 'size', width: Math.round(r.width), height: Math.round(r.height), sharing: sharing });
      }
      // Zoom draws the player a moment after joining, and redraws it on every change of view.
      // While the teacher shares a screen the strip view (shared screen large, the class in a column) is the one that
      // gives the shared screen room; the other views squeeze it into a corner. So the strip view is used for as
      // long as a screen is shared, then the teacher view comes back.
      let view = 'speaker';
      let switching = false;
      function keepViewRight() {
        if (!activeClient || switching) return;
        const sharing = isSharing();
        const want = sharing ? 'ribbon' : 'speaker';
        if (want === view) return;
        switching = true;
        Promise.resolve(activeClient.setViewType(want)).then(
          function () {
            view = want;
            switching = false;
            asked = '';
          },
          function () {
            switching = false;
          },
        );
      }
      // Zoom opens its panels (chat, people, settings) beside the player, on whichever side has room. The player is
      // centred and large, so neither side has room and the panel lands out of sight. A panel that is not fully on
      // screen is docked at the right edge, below the app's buttons at the top, so it floats over the video without
      // moving it; a notice (such as "this meeting is being recorded") goes to the middle. The move is measured from
      // where it is now, so a panel inside a moved parent lands where it should.
      function moveTo(el, x, y) {
        const r = el.getBoundingClientRect();
        const m = /translate(?:3d)?\(([-\d.]+)px,\s*([-\d.]+)px/.exec(el.style.transform || '');
        const tx = (m ? parseFloat(m[1]) : 0) + x - r.left;
        const ty = (m ? parseFloat(m[2]) : 0) + y - r.top;
        el.style.setProperty('transform', 'translate3d(' + Math.round(tx) + 'px,' + Math.round(ty) + 'px,0)', 'important');
      }
      function keepPopupsVisible() {
        const topSafe = room && room.scale ? Math.round(120 / room.scale) : 120;
        const panels = Array.prototype.slice.call(document.querySelectorAll('.zoom-MuiPopper-root, .react-draggable'));
        panels.forEach(function (el) {
          if (el.hasAttribute('data-mirai-player') || el.classList.contains('zoom-MuiBox-root')) return;
          if (el.matches('.react-draggable') && el.closest('.zoom-MuiPopper-root')) return;
          const r = el.getBoundingClientRect();
          if (r.width < 300 || r.height < 200) return;
          if (r.left >= 0 && r.right <= window.innerWidth && r.top >= 0 && r.bottom <= window.innerHeight) return;
          const notice = /being recorded|Got it/i.test(el.innerText || '') && r.height < 400;
          const x = notice ? (window.innerWidth - r.width) / 2 : window.innerWidth - r.width - 12;
          const y = notice
            ? (window.innerHeight - r.height) / 2
            : Math.max(0, Math.min(topSafe, window.innerHeight - r.height - 12));
          moveTo(el, Math.max(0, x), Math.max(0, y));
        });
      }
      new MutationObserver(function () {
        reportSize();
        keepPopupsVisible();
        keepViewRight();
        fitPlayer();
        fitSharedScreen();
      }).observe(document.body, { childList: true, subtree: true, attributes: true });
      window.addEventListener('resize', reportSize);

      let joined = false;
      // Leave on purpose, so Zoom marks the child as gone at once (a closed tab is noticed only minutes later).
      function leave() {
        if (!activeClient || !joined) return;
        joined = false;
        try {
          Promise.resolve(activeClient.leaveMeeting()).catch(function () {});
        } catch (err) {}
      }
      window.addEventListener('pagehide', leave);
      window.addEventListener('message', async function (e) {
        if (e.origin !== window.location.origin || e.source !== window.parent) return;
        const data = e.data || {};
        if (data.type === 'leave') {
          leave();
          return;
        }
        if (data.type === 'people') {
          showPeople = Boolean(data.show);
          asked = '';
          fitPlayer();
          return;
        }
        if (data.type === 'room' && data.width > 50 && data.height > 50) {
          room = { width: data.width, height: data.height, scale: data.scale || 1 };
          asked = '';
          fitPlayer();
          return;
        }
        if (data.type !== 'join' || joined) return;
        const p = data.payload;
        try {
          await ready;
          const client = window.ZoomMtgEmbedded.createClient();
          await client.init({
            zoomAppRoot: document.getElementById('root'),
            language: 'en-US',
            patchJsMedia: true,
            leaveOnPageUnload: true,
            customize: {
              // Zoom's own defaults, nothing locked: its view, toolbar and buttons all show. We narrow
              // this down after seeing what the real player offers.
              video: {
                isResizable: false,
                // The teacher big, with the class in a small row above. While the teacher shares a screen Zoom
                // itself switches to the strip view: the shared screen large, the class in a column at the right.
                defaultViewType: 'speaker',
              },
            },
          });
          await client.join({
            signature: p.signature,
            meetingNumber: p.meetingNumber,
            password: p.password,
            userName: p.userName,
            userEmail: p.userEmail,
            tk: p.tk,
            customerKey: p.customerKey,
          });
          joined = true;
          activeClient = client;
          send({ type: 'joined' });
          client.on('connection-change', function (c) {
            if (c && c.state === 'Closed') {
              joined = false;
              send({ type: 'left' });
            }
          });
        } catch (err) {
          send({ type: 'error', message: (err && (err.reason || err.message)) || 'Could not join the class video.' });
        }
      });

      ready.then(
        function () {
          send({ type: 'ready' });
        },
        function (err) {
          send({ type: 'error', message: err.message });
        },
      );
    </script>
  </body>
</html>
