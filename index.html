<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirai AI School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Shown straight away, before any script has arrived, so nobody sees a blank
      white page while the app downloads. React replaces it as soon as it starts.
      A form page gets the same pink backdrop as the form; inside another
      website's iframe it stays see-through.
    -->
    <style>
      body {
        margin: 0;
      }
      #boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      #boot span {
        width: 48px;
        height: 48px;
        box-sizing: border-box;
        border: 4px solid #fce7f3;
        border-top-color: #fc0c97;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot p {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #475569;
      }
      html.boot-form body {
        background: linear-gradient(to bottom, #ffd9ee, #fff3fa, #fff);
      }
      html.boot-embed #boot {
        min-height: 320px;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      if (/[?&]form=/.test(location.search)) {
        document.documentElement.className = window.parent !== window ? 'boot-embed' : 'boot-form'
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <span aria-hidden="true"></span>
        <p>Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
